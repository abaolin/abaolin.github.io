<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>贪食蛇 | Kris's Blog</title>
  <style>:root{color-scheme:dark;--bg:#101317;--panel:#1a212b;--line:#303947;--text:#f6f8fb;--muted:#aab4c3;--green:#42d6a4;--gold:#f5b642;--red:#ff657a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#12171d,#0d1015);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(920px,calc(100vw - 24px));margin:0 auto;padding:20px 0 28px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px}.top a{color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:9px 12px}h1{margin:0;font-size:clamp(24px,4vw,40px)}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}.stat b{display:block;font-size:20px}.stat span{color:var(--muted);font-size:12px}.wrap{display:grid;place-items:center;background:#111820;border:1px solid var(--line);border-radius:8px;padding:12px}canvas{width:min(100%,660px);aspect-ratio:1/1;background:#0b1117;border-radius:6px;touch-action:none}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:12px;color:var(--muted);line-height:1.6}.buttons{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);background:#202836;color:var(--text);border-radius:8px;padding:10px 13px;font-weight:700}.touch{display:none;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,48px);gap:8px;justify-content:center;margin-top:14px}.touch button:nth-child(1){grid-column:2}.touch button:nth-child(2){grid-column:1;grid-row:2}.touch button:nth-child(3){grid-column:3;grid-row:2}.touch button:nth-child(4){grid-column:2;grid-row:3}@media(max-width:760px){.hud{grid-template-columns:repeat(2,1fr)}.bar{display:block}.touch{display:grid}.top a{white-space:nowrap}}</style>
</head>
<body><main><div class="top"><h1>贪食蛇</h1><a href="/games/">返回游戏列表</a></div><section class="hud"><div class="stat"><b id="score">0</b><span>得分</span></div><div class="stat"><b id="speed">1</b><span>速度</span></div><div class="stat"><b id="len">3</b><span>长度</span></div><div class="stat"><b id="best">0</b><span>最高分</span></div></section><div class="wrap"><canvas id="game" width="600" height="600"></canvas></div><div class="bar"><div>方向键/WASD 控制，P 暂停，R 重开。连续吃到金色食物会逐步加速。</div><div class="buttons"><button id="start">开始/暂停</button><button id="restart">重新开始</button></div></div><div class="touch"><button data-d="0,-1">上</button><button data-d="-1,0">左</button><button data-d="1,0">右</button><button data-d="0,1">下</button></div></main>
<script>(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),N=24,S=600/N;const ui={score:document.getElementById('score'),speed:document.getElementById('speed'),len:document.getElementById('len'),best:document.getElementById('best')};let snake,dir,next,food,scoreV,bestV=Number(localStorage.snakeBest||0),tick,acc,last,running,over;ui.best.textContent=bestV;function reset(){snake=[{x:8,y:12},{x:7,y:12},{x:6,y:12}];dir={x:1,y:0};next={x:1,y:0};scoreV=0;tick=.15;acc=0;last=0;running=false;over=false;spawn();hud();draw()}function spawn(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}function hud(){ui.score.textContent=scoreV;ui.speed.textContent=Math.round((.18/tick)*10)/10;ui.len.textContent=snake.length;ui.best.textContent=bestV}function setDir(dx,dy){if(dir.x+dx===0&&dir.y+dy===0)return;next={x:dx,y:dy};if(!running&&!over){running=true;requestAnimationFrame(loop)}}function loop(t){let dt=Math.min((t-last)/1000||0,.05);last=t;if(running){acc+=dt;while(acc>tick){step();acc-=tick}}draw();if(running)requestAnimationFrame(loop)}function step(){dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=N||h.y<0||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)){over=true;running=false;bestV=Math.max(bestV,scoreV);localStorage.snakeBest=bestV;hud();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){scoreV+=100+Math.max(0,Math.floor((.15-tick)*1000));tick=Math.max(.065,tick*.96);spawn()}else snake.pop();hud()}function draw(){x.fillStyle='#0a1016';x.fillRect(0,0,600,600);x.strokeStyle='#182432';x.lineWidth=1;for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,600);x.stroke();x.beginPath();x.moveTo(0,i*S);x.lineTo(600,i*S);x.stroke()}x.fillStyle='#f5b642';x.beginPath();x.arc(food.x*S+S/2,food.y*S+S/2,S*.34,0,Math.PI*2);x.fill();snake.forEach((p,i)=>{x.fillStyle=i?'#42d6a4':'#8fffe0';x.fillRect(p.x*S+2,p.y*S+2,S-4,S-4);if(i===0){x.fillStyle='#102019';x.fillRect(p.x*S+S*.62,p.y*S+S*.28,3,3);x.fillRect(p.x*S+S*.62,p.y*S+S*.62,3,3)}});if(!running){x.fillStyle='rgba(0,0,0,.48)';x.fillRect(0,0,600,600);x.fillStyle='#fff';x.textAlign='center';x.font='700 34px system-ui';x.fillText(over?'游戏结束':'贪食蛇',300,284);x.font='18px system-ui';x.fillText(over?'按 R 重新开始':'按方向键或点击开始',300,322);x.textAlign='left'}}window.addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowUp'||k==='w'||k==='W')setDir(0,-1);if(k==='ArrowDown'||k==='s'||k==='S')setDir(0,1);if(k==='ArrowLeft'||k==='a'||k==='A')setDir(-1,0);if(k==='ArrowRight'||k==='d'||k==='D')setDir(1,0);if(k==='p'||k==='P'){running=!running;if(running)requestAnimationFrame(loop);else draw()}if(k==='r'||k==='R')reset()});document.getElementById('start').onclick=()=>{if(over)reset();running=!running;if(running)requestAnimationFrame(loop);else draw()};document.getElementById('restart').onclick=reset;document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const [dx,dy]=b.dataset.d.split(',').map(Number);setDir(dx,dy)});reset()})();</script></body></html>
