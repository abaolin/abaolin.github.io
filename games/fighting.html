<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>格斗游戏 | Kris's Blog</title><style>:root{color-scheme:dark;--bg:#111318;--panel:#1b2029;--line:#303847;--text:#f6f8fb;--muted:#aab4c3;--green:#42d6a4;--gold:#f5b642;--red:#ff657a;--blue:#62b6ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#161820,#0d0f14);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(1120px,calc(100vw - 24px));margin:0 auto;padding:20px 0 28px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px}.top a{color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:9px 12px}h1{margin:0;font-size:clamp(24px,4vw,40px)}.hud{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}.name{display:flex;justify-content:space-between;margin-bottom:8px;color:var(--muted)}.meter{height:16px;background:#0b1016;border-radius:999px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--green),var(--gold));width:100%}.enemy .fill{background:linear-gradient(90deg,var(--red),#ffad65)}canvas{display:block;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:8px;background:#12151c;touch-action:none}.bar{display:flex;justify-content:space-between;gap:12px;margin-top:12px;color:var(--muted);line-height:1.6}.buttons,.touch{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);background:#202836;color:var(--text);border-radius:8px;padding:10px 13px;font-weight:700}.touch{display:none;margin-top:12px}.touch button{min-height:46px;min-width:58px}@media(max-width:760px){.hud{grid-template-columns:1fr}.bar{display:block}.touch{display:flex}.top a{white-space:nowrap}}</style></head>
<body><main><div class="top"><h1>格斗游戏</h1><a href="/games/">返回游戏列表</a></div><section class="hud"><div class="card"><div class="name"><b>玩家</b><span id="pstat">100</span></div><div class="meter"><div id="php" class="fill"></div></div></div><div class="card enemy"><div class="name"><b>AI 对手</b><span id="estat">100</span></div><div class="meter"><div id="ehp" class="fill"></div></div></div></section><canvas id="game" width="960" height="540"></canvas><div class="bar"><div>A/D 移动，W 跳跃，S 格挡，J 拳，K 腿，R 重开。移动接近后出招命中。</div><div class="buttons"><button id="start">开始/暂停</button><button id="restart">重新开始</button></div></div><div class="touch"><button data-k="a">左</button><button data-k="d">右</button><button data-k="w">跳</button><button data-k="s">挡</button><button data-k="j">拳</button><button data-k="k">腿</button></div></main><script>(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),G=1600,FLOOR=430;const keys=new Set();const ui={php:document.getElementById('php'),ehp:document.getElementById('ehp'),pstat:document.getElementById('pstat'),estat:document.getElementById('estat')};let p,e,last=0,running=false,over=false,msg='';function fighter(x,color,ai=false){return{x,y:FLOOR-96,w:46,h:96,vx:0,vy:0,face:ai?-1:1,hp:100,color,block:false,atk:0,kind:'',cool:0,ai}}function reset(){p=fighter(220,'#42d6a4');e=fighter(700,'#ff657a',true);last=0;running=false;over=false;msg='格斗游戏';hud();draw()}function hud(){ui.php.style.width=Math.max(0,p.hp)+'%';ui.ehp.style.width=Math.max(0,e.hp)+'%';ui.pstat.textContent=Math.max(0,Math.round(p.hp));ui.estat.textContent=Math.max(0,Math.round(e.hp))}function attack(a,k){if(a.cool>0||a.atk>0)return;a.kind=k;a.atk=k==='kick'?.34:.24;a.cool=k==='kick'?.62:.44}function rect(a){return{x:a.x-a.w/2,y:a.y,w:a.w,h:a.h}}function hitbox(a){let reach=a.kind==='kick'?62:46;return{x:a.face>0?a.x+18:a.x-reach-18,y:a.y+(a.kind==='kick'?48:28),w:reach,h:a.kind==='kick'?18:22}}function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function hurt(target,amt,from){if(target.block&&Math.sign(from.x-target.x)===target.face){amt*=.3;target.vx+=from.face*90}else target.vx+=from.face*230;target.hp-=amt;if(target.hp<=0){target.hp=0;over=true;running=false;msg=target.ai?'玩家胜利':'AI 胜利'}hud()}function step(dt){p.cool-=dt;e.cool-=dt;p.atk-=dt;e.atk-=dt;p.block=keys.has('s')||keys.has('S');let mv=(keys.has('d')||keys.has('D'))-(keys.has('a')||keys.has('A'));p.vx=mv*260;if((keys.has('w')||keys.has('W'))&&p.y>=FLOOR-p.h-1)p.vy=-650;if(keys.has('j')||keys.has('J'))attack(p,'punch');if(keys.has('k')||keys.has('K'))attack(p,'kick');ai(dt);[p,e].forEach(a=>{a.face=a.x<(a.ai?p.x:e.x)?1:-1;a.vy+=G*dt;a.x+=a.vx*dt;a.y+=a.vy*dt;a.vx*=.84;if(a.y>FLOOR-a.h){a.y=FLOOR-a.h;a.vy=0}a.x=Math.max(50,Math.min(910,a.x))});resolveAttacks(p,e);resolveAttacks(e,p)}function ai(dt){let dist=p.x-e.x,ad=Math.abs(dist);e.block=false;if(ad>78){e.vx=Math.sign(dist)*170}else{e.vx=0;if(p.atk>0&&Math.random()<.45)e.block=true;if(e.cool<=0&&Math.random()<.08)attack(e,Math.random()<.55?'punch':'kick')}if(ad>180&&Math.random()<.006&&e.y>=FLOOR-e.h-1)e.vy=-610}function resolveAttacks(a,b){if(a.atk>0&&!a.done&&a.atk<(a.kind==='kick'?.24:.16)){if(overlap(hitbox(a),rect(b))){hurt(b,a.kind==='kick'?15:10,a);a.done=true}}if(a.atk<=0)a.done=false}function drawF(a){x.save();x.translate(a.x,a.y);x.scale(a.face,1);x.fillStyle=a.block?'#62b6ff':a.color;x.fillRect(-23,30,46,66);x.beginPath();x.arc(0,16,18,0,Math.PI*2);x.fill();x.fillRect(a.atk>0?18:16,48,a.kind==='kick'?20:36,10);x.fillRect(-20,94,14,42);x.fillRect(6,94,14,42);if(a.atk>0&&a.kind==='kick')x.fillRect(20,98,48,12);x.restore()}function draw(){x.clearRect(0,0,960,540);let g=x.createLinearGradient(0,0,0,540);g.addColorStop(0,'#171b26');g.addColorStop(1,'#0e1117');x.fillStyle=g;x.fillRect(0,0,960,540);x.fillStyle='#222b36';x.fillRect(0,FLOOR,960,110);x.strokeStyle='#3a4555';for(let i=0;i<960;i+=80){x.beginPath();x.moveTo(i,FLOOR);x.lineTo(i+42,540);x.stroke()}drawF(p);drawF(e);if(!running){x.fillStyle='rgba(0,0,0,.46)';x.fillRect(0,0,960,540);x.fillStyle='#fff';x.textAlign='center';x.font='700 38px system-ui';x.fillText(msg||'暂停',480,244);x.font='18px system-ui';x.fillText(over?'按 R 或点击重新开始':'点击开始，靠近后出拳或踢击',480,284);x.textAlign='left'}}function loop(t){let dt=Math.min((t-last)/1000||0,.033);last=t;if(running&&!over)step(dt);draw();if(running)requestAnimationFrame(loop)}window.addEventListener('keydown',ev=>{keys.add(ev.key);if(ev.key==='r'||ev.key==='R')reset();if(ev.key==='p'||ev.key==='P'){running=!running;if(running)requestAnimationFrame(loop);else draw()}});window.addEventListener('keyup',ev=>keys.delete(ev.key));document.getElementById('start').onclick=()=>{if(over)reset();running=!running;if(running)requestAnimationFrame(loop);else draw()};document.getElementById('restart').onclick=reset;document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=()=>keys.add(k);b.onpointerup=b.onpointercancel=()=>keys.delete(k)});reset()})();</script></body></html>
